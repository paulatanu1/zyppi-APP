<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Order Placed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}
.cf{position:absolute;top:0;width:8px;height:14px;border-radius:2px;animation:z-confetti 2.8s cubic-bezier(.3,.6,.4,1) infinite}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;color:var(--ink-2);font-weight:600}
.kv + .kv{border-top:1px solid var(--line)}
.kv b{color:var(--ink);font-weight:800}
</style>
</helmet>
<div class="{{mode}}" style="display:flex;flex-direction:column;padding:20px 20px 24px">
  <div aria-hidden="true" style="position:absolute;inset:0 0 auto 0;height:420px;overflow:hidden;pointer-events:none">
    <span class="cf" style="left:8%;background:#D4127B;animation-delay:0s"></span>
    <span class="cf" style="left:20%;background:#FFC83D;animation-delay:.6s;width:10px;height:10px;border-radius:5px"></span>
    <span class="cf" style="left:33%;background:#2443D6;animation-delay:1.2s"></span>
    <span class="cf" style="left:47%;background:#3FD27F;animation-delay:.3s;width:6px"></span>
    <span class="cf" style="left:60%;background:#D4127B;animation-delay:1.6s;width:10px;height:10px;border-radius:5px"></span>
    <span class="cf" style="left:72%;background:#FFC83D;animation-delay:.9s"></span>
    <span class="cf" style="left:84%;background:#2443D6;animation-delay:2s;width:6px"></span>
    <span class="cf" style="left:93%;background:#3FD27F;animation-delay:1.3s"></span>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-top:18px">
    <div class="pop" style="position:relative;width:88px;height:88px;border-radius:44px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(19,138,74,.35)">
      <span class="ring" style="color:var(--ok)"></span>
      <svg class="ic" style="width:44px;height:44px;stroke-width:3" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div class="in" style="--i:2;display:flex;flex-direction:column;gap:6px">
      <h1 class="h" style="margin:0;font-size:28px">Order placed!</h1>
      <p class="muted" style="margin:0;font-size:15px;line-height:1.5">We're packing your groceries.<br>Arriving in about <strong style="color:var(--ink)">12 minutes</strong>.</p>
    </div>
  </div>

  <div class="illo in" style="--i:3;height:210px;margin-top:20px;background:#EEF4FB">
    <img class="bob" src="img/splash-door.png" alt="" style="height:196px">
  </div>

  <section class="card in" style="--i:4;margin-top:16px;padding:6px 16px">
    <div class="kv"><span>Order ID</span><b>#ZP-[ORDER ID]</b></div>
    <div class="kv"><span>Paid via UPI</span><b>₹477</b></div>
    <div class="kv"><span>Deliver to</span><b>Home · Ranchi Road</b></div>
  </section>

  <div style="flex:1"></div>
  <div class="in" style="--i:5;display:flex;flex-direction:column;gap:8px">
    <a href="Tracking.dc.html" class="btn">Track order</a>
    <a href="Main.dc.html" class="btn line">Continue shopping</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.dark ? 'z dark' : 'z' }; }
}
</script>
</body>
</html>
