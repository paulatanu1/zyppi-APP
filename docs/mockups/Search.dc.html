<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Search</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}
.res{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--ink)}
.res + .res{border-top:1px solid var(--line)}
.res .tile{width:56px;height:56px;flex:none}
</style>
</helmet>
<div class="{{mode}}" style="display:flex;flex-direction:column">
  <header style="padding:12px 16px 12px 8px;display:flex;align-items:center;gap:6px;background:var(--surface);border-bottom:1px solid var(--line)">
    <a href="Main.dc.html" class="icon-btn clear" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="field focus" style="flex:1;height:48px;padding:0 6px 0 12px;border-radius:14px">
      <svg class="ic" style="color:var(--ink-3)" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden">Search products</label>
      <input id="q" value="app" style="font-size:15px;letter-spacing:0">
      <button class="icon-btn clear" aria-label="Clear" style="width:36px;height:36px;color:var(--ink-3)"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg></button>
    </div>
  </header>

  <div style="padding:16px;display:flex;flex-direction:column;gap:20px">
    <section class="in" style="display:flex;flex-direction:column;gap:10px">
      <div class="sec"><span class="over">Recent</span><a href="#" style="font-size:12px">Clear</a></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <a href="#" class="chip"><svg class="ic" style="width:15px;height:15px;color:var(--ink-3)" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>milk</a>
        <a href="#" class="chip"><svg class="ic" style="width:15px;height:15px;color:var(--ink-3)" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>brown bread</a>
        <a href="#" class="chip"><svg class="ic" style="width:15px;height:15px;color:var(--ink-3)" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>mustard oil</a>
      </div>
    </section>

    <section class="in" style="--i:1;display:flex;flex-direction:column">
      <span class="over" style="padding-bottom:4px">Results for “app”</span>
      <a href="Product.dc.html" class="res"><span class="tile" style="background:var(--t-fruit)"><img src="img/apple.png" alt=""></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:700;font-size:14.5px"><mark style="background:var(--brand-soft);color:var(--brand-text);border-radius:3px;padding:0">App</mark>les, Shimla</span><span class="faint" style="font-size:12.5px;font-weight:600">1 kg · <span class="price" style="font-size:13px">₹179</span> <span class="mrp">₹199</span></span></span><span class="add">ADD</span></a>
      <a href="Product.dc.html" class="res"><span class="tile" style="background:var(--t-drink)"><img src="img/juice.png" alt=""></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:700;font-size:14.5px"><mark style="background:var(--brand-soft);color:var(--brand-text);border-radius:3px;padding:0">App</mark>le Juice, No Added Sugar</span><span class="faint" style="font-size:12.5px;font-weight:600">1 L · <span class="price" style="font-size:13px">₹129</span></span></span><span class="add">ADD</span></a>
      <a href="Product.dc.html" class="res"><span class="tile" style="background:var(--t-veg)"><img src="img/basket.png" alt=""></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:700;font-size:14.5px">Fruit Basket with <mark style="background:var(--brand-soft);color:var(--brand-text);border-radius:3px;padding:0">App</mark>les</span><span class="faint" style="font-size:12.5px;font-weight:600">5 kg · <span class="price" style="font-size:13px">₹399</span></span></span><span class="add">ADD</span></a>
      <a href="Category.dc.html" class="res" style="font-weight:800;font-size:14px;color:var(--brand-text)">See all 24 results <svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
    </section>

    <section class="in" style="--i:2;display:flex;flex-direction:column;gap:10px">
      <span class="over">Trending in Purulia</span>
      <div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px">
        <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:12px;font-weight:700"><span class="tile" style="width:100%;height:64px;background:var(--t-dairy)"><img src="img/dairy.png" alt=""></span>Paneer</a>
        <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:12px;font-weight:700"><span class="tile" style="width:100%;height:64px;background:var(--t-oil)"><img src="img/oil.png" alt=""></span>Mustard oil</a>
        <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:12px;font-weight:700"><span class="tile" style="width:100%;height:64px;background:var(--t-bakery)"><img src="img/bread.png" alt=""></span>Bread</a>
        <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:12px;font-weight:700"><span class="tile" style="width:100%;height:64px;background:var(--t-meat)"><img src="img/meat.png" alt=""></span>Fish</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.dark ? 'z dark' : 'z' }; }
}
</script>
</body>
</html>
