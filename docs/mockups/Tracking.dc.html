<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Order Tracking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D81B87}a:hover{color:#A8106A}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h{font-family:'Montserrat',sans-serif;letter-spacing:-0.01em}
.muted{color:#5B655F}
.road{position:absolute;background:#fff}
.rb{width:44px;height:44px;border-radius:22px;background:#fff;color:#17201B;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(23,32,27,0.14)}
.st{display:flex;gap:12px;position:relative}
.dot{width:22px;height:22px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;z-index:1}
.done .dot{background:#D81B87;color:#fff}
.now .dot{background:#FFCB45;border:4px solid #FFF1C2;box-sizing:content-box;width:14px;height:14px;margin:0 0 0 0}
.todo .dot{background:#fff;border:2px solid #C9CEC6;box-sizing:border-box}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#E9ECE4;font-family:'Poppins',sans-serif;color:#17201B;box-sizing:border-box">
  <div aria-hidden="true">
    <div class="road" style="left:0;right:0;top:120px;height:12px"></div>
    <div class="road" style="left:0;right:0;top:250px;height:10px"></div>
    <div class="road" style="top:0;height:380px;left:90px;width:10px"></div>
    <div class="road" style="top:0;height:380px;left:290px;width:12px"></div>
    <svg style="position:absolute;left:0;top:0" width="390" height="380" viewBox="0 0 390 380"><path d="M95 330 V255 H296 V126 H330" fill="none" stroke="#D81B87" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/></svg>
    <div style="position:absolute;left:180px;top:238px;width:40px;height:40px;border-radius:20px;background:#D81B87;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(216,27,135,0.2)"><svg class="ic" viewBox="0 0 24 24"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/></svg></div>
    <div style="position:absolute;left:316px;top:104px;color:#C2410C"><svg class="ic" style="width:36px;height:36px;fill:#FDECE7" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
  </div>
  <a href="Main.dc.html" class="rb" aria-label="Close" style="position:absolute;left:16px;top:16px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></a>
  <a href="#" class="rb" style="position:absolute;right:16px;top:16px;width:auto;padding:0 16px;font-weight:700;font-size:13px;text-decoration:none;color:#17201B">Help</a>

  <section style="position:absolute;left:0;right:0;bottom:0;top:350px;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 -4px 20px rgba(23,32,27,0.08)">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div><div class="muted" style="font-size:12px;font-weight:700;letter-spacing:0.06em">ARRIVING IN</div><div class="h" style="font-size:30px;font-weight:700">6 min</div></div>
      <div style="background:#FFECF7;color:#A8106A;font-weight:700;font-size:12px;padding:6px 10px;border-radius:8px">On the way</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #E4E6E1;border-radius:14px">
      <div style="width:44px;height:44px;border-radius:22px;background:#EEF0EA;color:#5B655F;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">[Rider name]</div><div class="muted" style="font-size:12px">Your delivery partner</div></div>
      <button aria-label="Call delivery partner" style="width:44px;height:44px;border-radius:22px;border:0;background:#D81B87;color:#fff;display:flex;align-items:center;justify-content:center"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
    </div>
    <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;position:relative">
      <li aria-hidden="true" style="position:absolute;left:10px;top:12px;bottom:12px;width:2px;background:#E4E6E1"></li>
      <li aria-hidden="true" style="position:absolute;left:10px;top:12px;height:96px;width:2px;background:#D81B87"></li>
      <li class="st done"><span class="dot"><svg class="ic" style="width:12px;height:12px;stroke-width:3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><div><div style="font-weight:700;font-size:14px">Order placed</div><div class="muted" style="font-size:12px">Payment received</div></div></li>
      <li class="st done"><span class="dot"><svg class="ic" style="width:12px;height:12px;stroke-width:3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><div><div style="font-weight:700;font-size:14px">Packed</div><div class="muted" style="font-size:12px">3 items checked at the store</div></div></li>
      <li class="st now"><span class="dot"></span><div><div style="font-weight:700;font-size:14px">Out for delivery</div><div class="muted" style="font-size:12px">Rider is 1.2 km away</div></div></li>
      <li class="st todo"><span class="dot"></span><div><div style="font-weight:600;font-size:14px;color:#5B655F">Delivered</div></div></li>
    </ol>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
