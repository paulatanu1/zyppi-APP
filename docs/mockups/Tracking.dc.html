<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Order Tracking</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}
.rider{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:20px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(212,18,123,.22),0 6px 14px rgba(0,0,0,.25);offset-path:path('M70 330 V250 H250 V120 H330');offset-rotate:0deg;animation:z-ride 7s ease-in-out infinite alternate}
.prog{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:6px}
.prog span{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;position:relative}
.prog span.done{background:var(--brand)}
.prog span.now::after{content:"";position:absolute;inset:0;width:55%;background:var(--brand);border-radius:3px}
.labels{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:6px;font-size:11px;font-weight:700;color:var(--ink-3)}
.labels .on{color:var(--ink)}
</style>
</helmet>
<div class="{{mode}}">
  <svg width="390" height="440" viewBox="0 0 390 440" aria-hidden="true" style="position:absolute;left:0;top:0">
    <rect class="m-bg" width="390" height="440"/>
    <path class="m-water" d="M270 300c40-12 100-6 120 8v132H260c-20-40-30-128 10-140z"/>
    <rect class="m-park" x="110" y="290" width="110" height="80" rx="12"/>
    <rect class="m-block" x="20" y="30" width="96" height="70" rx="10"/><rect class="m-block" x="140" y="30" width="96" height="70" rx="10"/><rect class="m-block" x="270" y="30" width="100" height="70" rx="10"/>
    <rect class="m-block" x="20" y="150" width="130" height="80" rx="10"/><rect class="m-block" x="170" y="150" width="60" height="80" rx="10"/><rect class="m-block" x="270" y="150" width="100" height="80" rx="10"/>
    <rect class="m-block" x="20" y="290" width="70" height="80" rx="10"/>
    <path class="m-road" stroke-width="14" d="M0 120h390M0 250h390M250 0v440"/>
    <path class="m-road" stroke-width="9" d="M70 120v320M130 0v120M0 390h260"/>
    <path class="m-route" d="M70 330 V250 H250 V120 H330" style="opacity:.25"/>
    <path class="m-route route" d="M70 330 V250 H250 V120 H330"/>
    <text class="m-label" x="10" y="116">RANCHI ROAD</text>
    <text class="m-label" x="290" y="372">SAHEB BANDH</text>
  </svg>
  <div style="position:absolute;left:0;top:0;width:390px;height:440px">
    <div style="position:absolute;left:52px;top:312px;width:36px;height:36px;border-radius:12px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center" title="Zyppi store"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg></div>
    <div style="position:absolute;left:312px;top:82px;display:flex;flex-direction:column;align-items:center">
      <div style="width:38px;height:38px;border-radius:19px 19px 19px 4px;transform:rotate(-45deg);background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)"><svg class="ic" style="width:18px;height:18px;color:#fff;transform:rotate(45deg)" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg></div>
    </div>
    <div class="rider"><svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="17.5" r="3"/><circle cx="18.5" cy="17.5" r="3"/><path d="M15 6h2l3 8M5.5 17.5 9 10h6l3.5 7.5M9 10l-1-3H5"/></svg></div>
  </div>

  <a href="Main.dc.html" class="icon-btn" aria-label="Close" style="position:absolute;left:16px;top:14px;box-shadow:var(--shadow)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  <a href="#" class="chip" style="position:absolute;right:16px;top:18px;box-shadow:var(--shadow)"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>Help</a>

  <section class="sheet rise" style="position:absolute;left:0;right:0;bottom:0;top:404px;padding:10px 18px 20px;display:flex;flex-direction:column;gap:14px">
    <span style="align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line-2)"></span>
    <div style="display:flex;align-items:flex-end;justify-content:space-between">
      <div><div class="over">Arriving in</div><div class="h" style="font-size:34px;line-height:1">6 <span style="font-size:18px">min</span></div></div>
      <span class="badge-s" style="background:var(--warn-soft);color:var(--warn);display:flex;align-items:center;gap:6px"><span class="pulse" style="width:8px;height:8px;border-radius:4px;background:currentColor"></span>On the way</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="prog"><span class="done"></span><span class="done"></span><span class="now"></span><span></span></div>
      <div class="labels"><span class="on">Placed</span><span class="on">Packed</span><span class="on">On the way</span><span>Delivered</span></div>
    </div>
    <div class="card" style="display:flex;align-items:center;gap:12px;padding:12px">
      <div style="width:46px;height:46px;border-radius:23px;background:var(--blue-soft);color:var(--blue-text);display:flex;align-items:center;justify-content:center;font:800 17px 'Sora',sans-serif">R</div>
      <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14.5px">[Rider name]</div><div class="faint" style="font-size:12px;font-weight:600">Your Zyppi partner · 1.2 km away</div></div>
      <button class="icon-btn" aria-label="Message rider"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z"/></svg></button>
      <button class="icon-btn" aria-label="Call rider" style="background:var(--ok);color:#fff;border-color:var(--ok)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
    </div>
    <a href="Orders.dc.html" class="well" style="display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--ink)">
      <span class="stack"><span style="border-color:var(--surface-2)"><img src="img/veg.png" alt=""></span><span style="border-color:var(--surface-2)"><img src="img/apple.png" alt=""></span><span style="border-color:var(--surface-2)"><img src="img/juice.png" alt=""></span></span>
      <span style="flex:1;font-weight:700;font-size:13.5px">3 items · ₹477 paid</span>
      <span style="font-size:13px;font-weight:800;color:var(--brand-text)">Details</span>
    </a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.dark ? 'z dark' : 'z' }; }
}
</script>
</body>
</html>
