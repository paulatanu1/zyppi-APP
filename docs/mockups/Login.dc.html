<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Login</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{mode}}" style="display:flex;flex-direction:column">
  <div class="fade" style="height:318px;background:var(--brand-soft);border-radius:0 0 36px 36px;position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden">
    <div style="position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:110px;background:var(--brand-soft-2)"></div>
    <div style="position:absolute;right:-40px;top:40px;width:120px;height:120px;border-radius:60px;background:var(--blue-soft)"></div>
    <a href="Onboarding.dc.html" class="icon-btn" aria-label="Back" style="position:absolute;left:16px;top:16px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <img class="bob" src="img/splash-phone.png" alt="" style="position:relative;height:270px;margin-bottom:-6px">
  </div>

  <div style="flex:1;padding:26px 20px 24px;display:flex;flex-direction:column;gap:16px">
    <div class="in" style="--i:1;display:flex;flex-direction:column;gap:6px">
      <h1 class="h" style="margin:0;font-size:27px">Log in or sign up</h1>
      <p class="muted" style="margin:0;font-size:15px">We'll text you a 6-digit code to verify your number.</p>
    </div>
    <div class="in" style="--i:2;display:flex;flex-direction:column;gap:8px">
      <label for="phone" style="font-size:13px;font-weight:700;color:var(--ink-2)">Mobile number</label>
      <div class="field focus">
        <span style="display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;padding-right:12px;border-right:1px solid var(--line)"><span aria-hidden="true" style="width:22px;height:15px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column"><span style="flex:1;background:#FF9933"></span><span style="flex:1;background:#FFFFFF"></span><span style="flex:1;background:#138808"></span></span>+91</span>
        <input id="phone" type="tel" inputmode="numeric" value="98765 43210">
      </div>
    </div>
    <a href="Otp.dc.html" class="btn in" style="--i:3">Continue</a>
    <div class="in" style="--i:4;display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px;font-weight:700"><span class="hr" style="flex:1"></span>OR<span class="hr" style="flex:1"></span></div>
    <button class="btn line in" style="--i:5">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <p class="faint" style="margin:auto 0 0;font-size:12px;line-height:1.5;text-align:center">By continuing you agree to Zyppi's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.dark ? 'z dark' : 'z' }; }
}
</script>
</body>
</html>
