<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi OTP</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}
.otp{width:50px;height:60px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;font:800 24px 'Sora',sans-serif;color:var(--ink)}
.otp.f{border-color:var(--brand-text);background:var(--brand-soft)}
.otp.cur{border-color:var(--brand-text);box-shadow:0 0 0 4px var(--brand-soft)}
</style>
</helmet>
<div class="{{mode}}" style="display:flex;flex-direction:column;padding:12px 20px 24px;gap:22px">
  <a href="Login.dc.html" class="icon-btn" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="in" style="--i:1;width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand-text);display:flex;align-items:center;justify-content:center;position:relative">
    <span class="ring"></span>
    <svg class="ic" style="width:30px;height:30px" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/><path d="M9 8h6M9 11h4"/></svg>
  </div>
  <div class="in" style="--i:2;display:flex;flex-direction:column;gap:6px">
    <h1 class="h" style="margin:0;font-size:27px">Enter verification code</h1>
    <p class="muted" style="margin:0;font-size:15px;line-height:1.5">Sent by SMS to <strong style="color:var(--ink)">+91 98765 43210</strong> · <a href="Login.dc.html" style="font-weight:800">Change</a></p>
  </div>
  <div class="in" role="group" aria-label="6-digit code" style="--i:3;display:flex;justify-content:space-between">
    <span class="otp f pop" style="animation-delay:.1s">4</span>
    <span class="otp f pop" style="animation-delay:.18s">8</span>
    <span class="otp f pop" style="animation-delay:.26s">2</span>
    <span class="otp f pop" style="animation-delay:.34s">7</span>
    <span class="otp cur"><span class="caret"></span></span>
    <span class="otp"></span>
  </div>
  <div class="in" style="--i:4;display:flex;align-items:center;gap:8px;font-size:14px" >
    <svg class="ic" style="width:18px;height:18px;color:var(--ink-3)" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span class="muted">Resend code in <strong style="color:var(--ink)">0:24</strong></span>
  </div>
  <div style="flex:1"></div>
  <div class="well" style="display:flex;gap:10px;align-items:center;padding:12px 14px;font-size:13px">
    <svg class="ic" style="width:18px;height:18px;color:var(--ok)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    <span class="muted">On Android the code fills in automatically.</span>
  </div>
  <a href="Location.dc.html" class="btn">Verify and continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.dark ? 'z dark' : 'z' }; }
}
</script>
</body>
</html>
