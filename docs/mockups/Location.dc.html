<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Location</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{mode}}">
  <svg width="390" height="500" viewBox="0 0 390 500" aria-hidden="true" style="position:absolute;left:0;top:0">
    <rect class="m-bg" width="390" height="500"/>
    <path class="m-water" d="M250 300c40-14 110-6 140 10v120c-40 10-100 6-130-14-26-18-40-102-10-116z"/>
    <rect class="m-park" x="24" y="300" width="120" height="86" rx="12"/>
    <rect class="m-block" x="24" y="40" width="96" height="84" rx="10"/><rect class="m-block" x="152" y="40" width="70" height="84" rx="10"/><rect class="m-block" x="254" y="40" width="112" height="60" rx="10"/>
    <rect class="m-block" x="24" y="160" width="60" height="100" rx="10"/><rect class="m-block" x="118" y="160" width="104" height="100" rx="10"/><rect class="m-block" x="254" y="134" width="112" height="126" rx="10"/>
    <rect class="m-block" x="176" y="300" width="50" height="86" rx="10"/><rect class="m-block" x="24" y="420" width="200" height="70" rx="10"/>
    <path class="m-road" stroke-width="14" d="M0 142h390M0 282h390M240 0v500M138 0v282"/>
    <path class="m-road" stroke-width="9" d="M100 142v140M0 404h240M160 282v222"/>
    <text class="m-label" x="10" y="138">RANCHI ROAD</text>
    <text class="m-label" x="270" y="372">SAHEB BANDH</text>
    <text class="m-label" transform="translate(236 250) rotate(-90)">STATION RD</text>
  </svg>

  <div class="in" style="position:absolute;left:16px;right:16px;top:14px;display:flex;gap:10px">
    <a href="Otp.dc.html" class="icon-btn" aria-label="Back" style="box-shadow:var(--shadow)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <label class="search" style="flex:1;height:44px;box-shadow:var(--shadow);border:1px solid var(--line)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search area, street, landmark" style="flex:1;border:0;outline:none;background:transparent;font:600 14px 'Manrope',sans-serif;color:var(--ink);min-width:0"></label>
  </div>

  <div style="position:absolute;left:195px;top:250px;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center" aria-hidden="true">
    <div class="pop" style="background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:8px 12px;border-radius:12px;white-space:nowrap;margin-bottom:8px">Your order will be delivered here</div>
    <div class="bob" style="width:44px;height:44px;border-radius:22px 22px 22px 4px;transform:rotate(-45deg);background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(212,18,123,.4)"><span style="width:16px;height:16px;border-radius:8px;background:#fff"></span></div>
    <div style="position:relative;width:20px;height:8px;margin-top:6px;color:var(--brand-text)"><span style="position:absolute;inset:0;border-radius:50%;background:currentColor;opacity:.3"></span><span class="ring" style="border-radius:50%"></span></div>
  </div>

  <button class="icon-btn" aria-label="Use my current location" style="position:absolute;right:16px;top:430px;width:auto;padding:0 14px;gap:6px;font:800 13px 'Manrope',sans-serif;color:var(--brand-text);box-shadow:var(--shadow)"><svg class="ic" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>Use current location</button>

  <section class="sheet rise" style="position:absolute;left:0;right:0;bottom:0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:14px">
    <span style="align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line-2)"></span>
    <div style="display:flex;gap:12px;align-items:flex-start">
      <span style="width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand-text);display:flex;align-items:center;justify-content:center;flex:none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
      <div style="flex:1;min-width:0"><div class="h" style="font-size:18px">Ranchi Road</div><div class="muted" style="font-size:13px;line-height:1.45">Near Saheb Bandh, Purulia, West Bengal 723101</div></div>
      <a href="#" style="font-weight:800;font-size:13px;padding:4px 0">Change</a>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800"><svg class="ic fill pulse" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Zyppi delivers here in about 12 minutes</div>
    <div style="display:flex;gap:8px">
      <span class="chip on"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>Home</span>
      <span class="chip"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Work</span>
      <span class="chip"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Other</span>
    </div>
    <a href="Main.dc.html" class="btn">Confirm location</a>
    <p class="faint" style="margin:0;font-size:12px;text-align:center">Now delivering in Purulia, Raghunathpur and Chelyama</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.dark ? 'z dark' : 'z' }; }
}
</script>
</body>
</html>
