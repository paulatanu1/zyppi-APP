<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Checkout</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;font:700 14px 'Manrope',sans-serif}
.opt.on{border-color:var(--brand-text);background:var(--brand-soft)}
.opt .lg{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.slot{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink-2);font:600 12px 'Manrope',sans-serif}
.slot.on{border-color:var(--brand-text);background:var(--brand-soft)}
.slot strong{color:var(--ink);font-size:14px;display:flex;align-items:center;gap:4px}
.steps{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.steps i{flex:1;height:2px;background:var(--line-2)}
.steps .d{width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;background:var(--surface-3);color:var(--ink-2)}
.steps .done .d,.steps .cur .d{background:var(--brand);color:#fff}
.steps .done,.steps .cur{color:var(--ink)}
.steps span{display:flex;align-items:center;gap:6px}
</style>
</helmet>
<div class="{{mode}}" style="display:flex;flex-direction:column">
  <header class="topbar" style="flex-direction:column;align-items:stretch;gap:10px;padding:10px 16px 14px 8px">
    <div style="display:flex;align-items:center;gap:8px">
      <a href="Cart.dc.html" class="icon-btn clear" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1 class="h ttl" style="margin:0">Checkout</h1>
      <span style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ok)"><svg class="ic" style="width:15px;height:15px" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure</span>
    </div>
    <div class="steps" style="padding-left:10px"><span class="done"><em class="d" style="font-style:normal">✓</em>Cart</span><i></i><span class="cur"><em class="d" style="font-style:normal">2</em>Details</span><i></i><span><em class="d" style="font-style:normal">3</em>Pay</span></div>
  </header>

  <div style="flex:1;padding:12px;display:flex;flex-direction:column;gap:12px">
    <section class="card in" style="padding:14px;display:flex;gap:12px;align-items:flex-start">
      <span style="width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);display:flex;align-items:center;justify-content:center;flex:none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg></span>
      <div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><span class="over" style="color:var(--ink-2)">Deliver to · Home</span><a href="Location.dc.html" style="font-size:13px;font-weight:800">Change</a></div><div style="font-weight:700;font-size:14px;margin-top:2px">Ranchi Road, near Saheb Bandh</div><div class="faint" style="font-size:12.5px;font-weight:600">Purulia 723101 · Atanu · +91 98765 43210</div></div>
    </section>

    <section class="card in" style="--i:1;padding:14px;display:flex;flex-direction:column;gap:10px">
      <span class="h" style="font-size:15px">Delivery time</span>
      <div style="display:flex;gap:8px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="2"><button class="{{s.cls}}" onClick="{{s.pick}}"><strong>{{s.title}}</strong>{{s.sub}}</button></sc-for>
      </div>
    </section>

    <section class="card in" style="--i:2;padding:14px;display:flex;flex-direction:column;gap:8px">
      <span class="h" style="font-size:15px">Payment</span>
      <sc-for list="{{pays}}" as="p" hint-placeholder-count="3">
        <button class="{{p.cls}}" onClick="{{p.pick}}"><span class="radio {{p.radio}}"></span><span class="lg"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{p.icon}}"/></svg></span><span style="flex:1">{{p.title}}<span class="faint" style="display:block;font-size:12px;font-weight:600">{{p.sub}}</span></span></button>
      </sc-for>
    </section>
  </div>

  <div class="rise" style="background:var(--surface);border-top:1px solid var(--line);padding:12px 16px 22px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span class="muted">3 items · You save ₹50</span><span>To pay <strong class="h" style="font-size:16px">₹477</strong></span></div>
    <a href="Placed.dc.html" class="btn">{{cta}}</a>
    <span class="faint" style="font-size:11.5px;text-align:center;font-weight:600">Payments secured by Razorpay</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { slot: 0, pay: 0 }; }
  renderVals() {
    const slots = [{ title: '⚡ Express', sub: 'In 12 minutes' }, { title: 'Schedule', sub: 'Today, 6–8 PM' }];
    const pays = [
      { title: 'UPI', sub: 'GPay, PhonePe, Paytm or any UPI app', icon: 'M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2', cta: 'Pay ₹477 with UPI' },
      { title: 'Credit or debit card', sub: 'Visa, Mastercard, RuPay', icon: 'M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM2 10h20', cta: 'Pay ₹477 by card' },
      { title: 'Cash on delivery', sub: 'Pay cash or UPI at your door', icon: 'M3 7h18v10H3zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z', cta: 'Place order · ₹477' }
    ];
    return {
      mode: this.props.dark ? 'z dark' : 'z',
      slots: slots.map((s, i) => ({ ...s, cls: i === this.state.slot ? 'slot on' : 'slot', pick: () => this.setState({ slot: i }) })),
      pays: pays.map((p, i) => ({ ...p, cls: i === this.state.pay ? 'opt on' : 'opt', radio: i === this.state.pay ? 'on' : '', pick: () => this.setState({ pay: i }) })),
      cta: pays[this.state.pay].cta
    };
  }
}
</script>
</body>
</html>
