<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Orders</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}
.ord{display:flex;flex-direction:column;gap:12px;padding:14px}
.ord .top{display:flex;align-items:center;gap:10px}
.ord .act{flex:1;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px}
</style>
</helmet>
<div class="{{mode}}" style="display:flex;flex-direction:column">
  <header class="topbar">
    <a href="Profile.dc.html" class="icon-btn clear" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 class="h ttl" style="margin:0">Your orders</h1>
  </header>
  <div style="padding:12px;display:flex;flex-direction:column;gap:12px">
    <div class="in" style="display:flex;gap:8px"><span class="chip on">All</span><span class="chip">Active</span><span class="chip">Delivered</span><span class="chip">Cancelled</span></div>

    <a href="Tracking.dc.html" class="card ord in" style="--i:1;color:var(--ink);border:1.5px solid var(--brand-text)">
      <div class="top"><span class="badge-s" style="background:var(--warn-soft);color:var(--warn);display:flex;align-items:center;gap:6px"><span class="pulse" style="width:7px;height:7px;border-radius:4px;background:currentColor"></span>On the way</span><span class="faint" style="margin-left:auto;font-size:12px;font-weight:700">Today, 7:42 PM</span></div>
      <div style="display:flex;align-items:center;gap:10px"><span class="stack"><span style="border-color:var(--surface);background:var(--surface-2)"><img src="img/veg.png" alt=""></span><span style="border-color:var(--surface);background:var(--surface-2)"><img src="img/apple.png" alt=""></span><span style="border-color:var(--surface);background:var(--surface-2)"><img src="img/juice.png" alt=""></span></span><span style="flex:1"></span><span style="text-align:right"><span class="h" style="font-size:16px;display:block">₹477</span><span class="faint" style="font-size:12px;font-weight:600">3 items</span></span></div>
      <span class="act" style="background:var(--brand);color:#fff">Track order · arriving in 6 min</span>
    </a>

    <section class="card ord in" style="--i:2">
      <div class="top"><span class="badge-s" style="background:var(--ok-soft);color:var(--ok)">Delivered</span><span class="faint" style="margin-left:auto;font-size:12px;font-weight:700">[Date] · in 11 min</span></div>
      <div style="display:flex;align-items:center;gap:10px"><span class="stack"><span style="border-color:var(--surface);background:var(--surface-2)"><img src="img/dairy.png" alt=""></span><span style="border-color:var(--surface);background:var(--surface-2)"><img src="img/bread.png" alt=""></span><span style="border-color:var(--surface);background:var(--surface-2)"><img src="img/oil.png" alt=""></span><span style="border-color:var(--surface);background:var(--surface-3);color:var(--ink-2);font-size:12px;font-weight:800">+4</span></span><span style="flex:1"></span><span style="text-align:right"><span class="h" style="font-size:16px;display:block">₹612</span><span class="faint" style="font-size:12px;font-weight:600">7 items</span></span></div>
      <div style="display:flex;gap:8px"><a href="Cart.dc.html" class="act" style="background:var(--brand-soft);color:var(--brand-text)"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reorder</a><a href="#" class="act" style="border:1px solid var(--line);color:var(--ink)">Invoice</a><a href="#" class="act" style="border:1px solid var(--line);color:var(--ink)">Rate</a></div>
    </section>

    <section class="card ord in" style="--i:3">
      <div class="top"><span class="badge-s" style="background:var(--danger-soft);color:var(--danger)">Cancelled</span><span class="faint" style="margin-left:auto;font-size:12px;font-weight:700">[Date]</span></div>
      <div style="display:flex;align-items:center;gap:10px"><span class="stack"><span style="border-color:var(--surface);background:var(--surface-2)"><img src="img/drinks.png" alt=""></span></span><span class="muted" style="flex:1;font-size:13px;font-weight:600">Refund of ₹90 sent to your UPI</span><span class="h" style="font-size:16px">₹90</span></div>
    </section>
  </div>

  <nav class="nav" aria-label="Main">
    <a href="Main.dc.html"><span class="pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg></span>Home</a>
    <a href="Category.dc.html"><span class="pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></span>Explore</a>
    <a href="Cart.dc.html"><span class="pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>Cart</a>
    <a href="#"><span class="pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg></span>Favourite</a>
    <a href="Profile.dc.html" class="on"><span class="pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Account</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.dark ? 'z dark' : 'z' }; }
}
</script>
</body>
</html>
