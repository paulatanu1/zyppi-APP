<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyppi Onboarding</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./zyppi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{mode}}" style="display:flex;flex-direction:column;padding:16px 20px 28px">
  <div class="fade" style="display:flex;align-items:center;justify-content:space-between;height:48px">
    <img class="only-light" src="img/logo.png" alt="Zyppi" style="height:34px">
    <img class="only-dark" src="img/logo-white.png" alt="Zyppi" style="height:34px">
    <a href="Login.dc.html" style="font-weight:800;font-size:14px;padding:12px 4px 12px 16px;color:var(--ink-2)">Skip</a>
  </div>

  <div class="illo in" style="--i:1;height:370px;margin-top:12px">
    <img class="bob" src="img/splash-ride.png" alt="" style="width:300px">
    <span class="float-chip float" style="left:14px;top:22px"><svg class="ic fill" style="width:16px;height:16px;color:var(--brand-text)" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>12 min delivery</span>
    <span class="float-chip float" style="right:14px;bottom:26px;animation-delay:-2s"><span style="width:22px;height:22px;border-radius:11px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center"><svg class="ic" style="width:14px;height:14px;stroke-width:3" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Fresh, quality checked</span>
  </div>

  <div class="in" style="--i:2;display:flex;flex-direction:column;gap:10px;margin-top:28px">
    <h1 class="h" style="margin:0;font-size:31px;line-height:1.12">Groceries at your door in <span style="color:var(--brand-text)">12 minutes</span></h1>
    <p class="muted" style="margin:0;font-size:15.5px;line-height:1.5">Fruits, vegetables, dairy and daily essentials from a store in your neighbourhood.</p>
  </div>

  <div style="flex:1"></div>
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:20px" aria-hidden="true">
    <span style="width:26px;height:6px;border-radius:3px;background:var(--brand)"></span>
    <span style="width:6px;height:6px;border-radius:3px;background:var(--line-2)"></span>
    <span style="width:6px;height:6px;border-radius:3px;background:var(--line-2)"></span>
  </div>
  <div class="in" style="--i:3;display:flex;flex-direction:column;gap:6px">
    <a href="Login.dc.html" class="btn">Get started</a>
    <a href="Login.dc.html" style="height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ink-2)">I already have an account · <strong style="color:var(--brand-text);margin-left:4px">Log in</strong></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.dark ? 'z dark' : 'z' }; }
}
</script>
</body>
</html>
