// Vendored + patched from the published phonepe_payment_sdk 3.0.2 package
// (see pubspec.yaml's dependency_overrides comment): the original
// compileSdk 31 is too low for several transitive androidx deps once the
// app's release build enables full dependency-API-level checking, and the
// original proguardFiles call used an API this project's AGP version
// removed outright. Both fixed below; otherwise unchanged.
group 'com.phonepe.phonepe_payment_sdk'
version '2.0.3'

buildscript {
    ext.kotlin_version = '1.8.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.phonepe.phonepe_payment_sdk'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk 21
        buildTypes {
            debug {
                minifyEnabled false
            }
            release {
                minifyEnabled true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }
    }

    dependencies {
        implementation 'phonepe.intentsdk.android.release:IntentSDK:5.2.0'
    }
}
