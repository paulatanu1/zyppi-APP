name: CI

on:
  pull_request:
    branches: [Development]
  push:
    branches: [main]

jobs:
  format-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7" # keep in sync with .fvmrc
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        # dev flavor: the mock-data assets are bundled only in dev/staging.
        run: flutter test --flavor dev

  # Every push to main proves a release build still compiles and shrinks
  # (R8 + the PayU keep rules). Staging, because a prod release needs the
  # upload key, which CI doesn't have.
  release-apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7" # keep in sync with .fvmrc
          channel: "stable"
          cache: true

      - name: Build release APK
        run: |
          cp env/staging.example.json env/staging.json
          flutter build apk --flavor staging --release --dart-define-from-file=env/staging.json

      - uses: actions/upload-artifact@v4
        with:
          name: zyppi-staging-release-apk
          path: build/app/outputs/flutter-apk/app-staging-release.apk
          retention-days: 7

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator needs Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci && npm install -g firebase-tools

      - name: Build
        run: npm run build

      - name: Test (emulators)
        run: npm test
