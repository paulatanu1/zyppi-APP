# Supabase CLI local dev config. Run `supabase link --project-ref <ref>`
# then `supabase db push` to apply supabase/migrations/ to a real
# project; `supabase start` to run the stack locally.
project_id = "zyppi"

[db]
port = 54322
major_version = 17

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false
# Configure a real SMS provider (Twilio/MessageBird/Vonage) before
# going live; the Supabase dashboard's test phone numbers are enough
# for the dev flavor.

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = ""
skip_nonce_check = true
