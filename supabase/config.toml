# Supabase CLI local dev config. Run `supabase link --project-ref <ref>`
# then `supabase db push` to apply supabase/migrations/ to a real
# project; `supabase start` to run the stack locally.
project_id = "zyppi"

[db]
port = 54322
major_version = 17

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false
# Supabase's test phone numbers (dashboard-configured) are enough for
# dev/staging - see [auth.hook.send_sms] below for the prod path.

[auth.hook.send_sms]
enabled = false
uri = "https://<project-ref>.supabase.co/functions/v1/send-sms-hook"
secrets = "env(SEND_SMS_HOOK_SECRET)"
# MSG91 (DLT sender ID + template) replaces Supabase's built-in SMS
# providers only in prod - flip `enabled` and fill in the real
# project-ref per environment; see send-sms-hook/index.ts for the
# other required secrets (MSG91_AUTH_KEY, MSG91_DLT_TEMPLATE_ID).

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = ""
skip_nonce_check = true

[functions.places-proxy]
# Authenticated app users only (anon key + a signed-in session); verified
# via the standard Supabase JWT check.
verify_jwt = true

[functions.create-razorpay-order]
verify_jwt = true

[functions.verify-razorpay-payment]
verify_jwt = true

[functions.push-on-order-event]
# Called by the on_order_event_notify trigger with the service role key
# as a bearer token, not an end-user session.
verify_jwt = true

[functions.send-sms-hook]
# Called by Supabase Auth itself (signed with the hook secret via
# standardwebhooks), not an app user - no Supabase JWT involved.
verify_jwt = false
