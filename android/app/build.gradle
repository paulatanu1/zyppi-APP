plugins {
    id 'com.android.application'
    id 'kotlin-android'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.zyppi.one'
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    buildFeatures {
        resValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = 'com.zyppi.one'
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // dev/staging/prod flavors share applicationId com.zyppi.one
    // (per CLAUDE.md) and the one google-services.json; they only vary the
    // displayed app name so all three can be installed side by side isn't
    // supported, but `--flavor <name>` selects which env/<name>.json config
    // flutter_run pairs with via --dart-define-from-file.
    flavorDimensions = ["env"]
    productFlavors {
        dev {
            dimension = "env"
            resValue "string", "app_name", "Zyppi Dev"
        }
        staging {
            dimension = "env"
            resValue "string", "app_name", "Zyppi Staging"
        }
        prod {
            dimension = "env"
            resValue "string", "app_name", "Zyppi"
        }
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Falls back to the debug keystore when key.properties doesn't
            // exist yet (so `flutter run --release` still works locally);
            // real release/Play builds need a real keystore supplied via
            // key.properties (gitignored - see key.properties.example).
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation("com.google.firebase:firebase-auth")
    implementation "com.google.android.gms:play-services-maps:19.0.0"
    // Native crash reporting + NDK symbol upload (deobfuscated Dart/Kotlin
    // stack traces) for firebase_crashlytics.
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")
}
